core_concepts:
  - id: capability-stock
    family: Accounting
    title: Capability Stock
    definition: Reusable teams, tools, memory, judgment, relationships, and transition options that persist beyond one output or project.
    test: Measure renewal, depreciation, reuse, and reconstitution cost beside annual spending.
  - id: effective-horizon
    family: Reliability
    title: Effective Horizon
    definition: The time for which every indispensable, non-transferable complement can remain available—not the nominal length of the longest grant.
    test: Identify the shortest-lived minimum cut between question and validated use.
  - id: adjacency-capital
    family: Capability
    title: Adjacency Capital
    definition: Accumulated reductions in the cost of routing expertise, exposing errors, coordinating unlike roles, and translating across layers.
    test: Compare experienced and reconstituted teams on routing time, rework, correction, and transition.
  - id: handoff-loss
    family: Reliability
    title: Handoff Loss
    definition: State lost when people, artifacts, assumptions, authority, or responsibility cross an institutional boundary.
    test: Track end-to-end continuation and reconstruction across every funded transfer.
  - id: common-mode
    family: Reliability
    title: Common-Mode Exposure
    definition: Apparently separate projects or evaluators that share the same model, data, metric, method, vendor, incentive, or transition bottleneck.
    test: Disclose model, evidence, method, and incentive distance before claiming independent confirmation.
  - id: epistemic-debt
    family: Knowledge
    title: Epistemic Debt
    definition: The gap between downstream confidence and dependence placed on a claim and the verification that claim has actually received.
    test: Maintain typed evidence states, dependency records, correction latency, and downstream repair.
  - id: abundance-inversion
    family: AI Age
    title: Abundance Inversion
    definition: As hypotheses, prose, code, and scientific form become cheap, independent witnesses, accountable attention, and physical evidence become scarcer.
    test: Measure verification queues and validated state changes rather than generated output volume.
  - id: charter-to-work
    family: Governance
    title: Charter-to-Work Drift
    definition: A long-horizon institutional name or legal mandate persists while actual work, authority, or staffing narrows toward short tasks.
    test: Compare the charter with who initiates work, what survives tasks, and which capabilities are renewed over time.
  - id: reversible-authority
    family: Governance
    title: Reversible Authority
    definition: Practiced technical leaders receive real discretion for a bounded term while dissent, verification, conflicts, appeals, and retrospective audits constrain capture.
    test: Record decision rights, prospective forecasts, overrides, minority views, and later calibration.
  - id: residual-owner
    family: Transition
    title: Residual Capability Owner
    definition: The institution still responsible after the paper, grant, program, degree, transaction, or prototype has satisfied its local obligation.
    test: Name the payer, custodian, transition owner, maintenance duty, review date, and termination rule.

