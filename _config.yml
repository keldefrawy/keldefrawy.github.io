title: Karim Eldefrawy
description: Research, publications, patents, software, and essays on cryptography, cybersecurity, privacy, and secure systems.
tagline: Cryptography, Cybersecurity, Privacy
discipline: Computer Science
url: https://keldefrawy.github.io
baseurl: ""
timezone: America/Los_Angeles
theme: jekyll-theme-minimal
lang: en-US
author:
  name: Karim Eldefrawy
  url: https://keldefrawy.github.io/
social:
  name: Karim Eldefrawy
  links:
    - https://scholar.google.com/citations?user=e9UP75IAAAAJ&hl=en
    - https://www.researchgate.net/profile/Karim-Eldefrawy-2
    - https://www.linkedin.com/pub/karim-eldefrawy/3/6b5/b70
    - https://github.com/keldefrawy

# Hosted GoatCounter site code (the prefix in CODE.goatcounter.com).
# Leave blank until the GoatCounter site exists and public visitor counts are enabled.
goatcounter:
  code: ""
  arcade_love_path: "/arcade-love"

plugins:
  - jekyll-sitemap

# Keep development and test infrastructure out of the published GitHub Pages
# artifact. The docs/ directory is intentionally not excluded.
exclude:
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - package.json
  - package-lock.json
  - playwright.config.mjs
  - vitest.config.mjs
  - scripts/
  - tests/
  - test-results/
  - playwright-report/
  - coverage/
  - vendor/

collections:
  papers:
    output: true
    permalink: /knowledge/papers/:name/
  rd_articles:
    output: true
    permalink: /rd-ratchet/:name/
  rd_revisions:
    output: true

defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: knowledge-map
  - scope:
      path: ""
      type: rd_articles
    values:
      layout: rd-article
      rd_series: true
  - scope:
      path: ""
      type: rd_revisions
    values:
      layout: rd-revision
      rd_series: true
  - scope:
      path: "notes"
    values:
      robots: "noindex, follow"
      sitemap: false

rd_ratchet:
  feedback_issue_url: https://github.com/keldefrawy/keldefrawy.github.io/issues/new
  feedback_issue_template: rd-ratchet-feedback.yml
  private_feedback_url: /#contact
